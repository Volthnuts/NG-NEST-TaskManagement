<div 
  *ngIf="isLoading" 
  class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-white/60 dark:bg-zinc-950/60 backdrop-blur-sm rounded-xl transition-all"
>
  <div class="flex flex-col items-center space-y-4">
    <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin dark:border-zinc-700 dark:border-t-indigo-500"></div>
    
    <p class="text-sm font-semibold text-gray-600 dark:text-zinc-300 animate-pulse">
      {{ text }}
    </p>
  </div>
</div>
