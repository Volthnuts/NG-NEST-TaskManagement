<div class="max-w-md w-full bg-white dark:bg-zinc-900 rounded-2xl border border-gray-100 dark:border-zinc-800/80 p-8 shadow-xl space-y-6 transition-all">
  
  <div class="text-center space-y-2">
    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-zinc-50 tracking-tight">Reset Password</h2>
    <p class="text-sm text-gray-500 dark:text-zinc-400">Please enter the new password you would like to use.</p>
  </div>

  <div *ngIf="!token && errorMessage" class="bg-rose-50 dark:bg-rose-500/10 p-4 rounded-xl border border-rose-100 dark:border-rose-500/20 text-center text-sm text-rose-600 dark:text-rose-400 font-medium">
    {{ errorMessage }}
  </div>

  <form *ngIf="token && !isSuccess" (ngSubmit)="onSubmit()" class="space-y-5">
    
    <div *ngIf="errorMessage" class="p-4 bg-rose-50 dark:bg-rose-500/10 border border-rose-100 dark:border-rose-500/20 text-sm text-rose-600 dark:text-rose-400 rounded-xl font-medium flex items-start gap-2">
      <span>⚠️</span>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- ช่อง New Password -->
    <div>
      <label class="block text-sm font-semibold mb-2 text-gray-600 dark:text-zinc-400">New Password</label>
      <div class="relative flex items-center">
        <!-- 🎯 เปลี่ยน type เป็นแบบ Dynamic binding ดึงตามตัวแปรใน TS -->
        <input [type]="showNewPassword ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" required placeholder="••••••••"
          class="w-full pl-4 pr-12 py-3 rounded-xl border focus:outline-none focus:ring-2 bg-white text-gray-950 border-gray-200 focus:ring-indigo-500 dark:bg-zinc-900 dark:text-zinc-100 dark:border-zinc-700 transition-all" />
        
        <!-- 🎯 ปุ่มเปิด/ปิดตา (สลับไอคอนดวงตา / ตาขีดฆ่า) -->
        <button type="button" (click)="showNewPassword = !showNewPassword"
          class="absolute right-3 p-1 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-zinc-300 cursor-pointer focus:outline-none transition-colors">
          <svg *ngIf="!showNewPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showNewPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ช่อง Confirm New Password -->
    <div>
      <label class="block text-sm font-semibold mb-2 text-gray-600 dark:text-zinc-400">Confirm New Password</label>
      <div class="relative flex items-center">
        <!-- 🎯 เปลี่ยน type เป็นแบบ Dynamic binding ดึงตามตัวแปรใน TS -->
        <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="••••••••"
          class="w-full pl-4 pr-12 py-3 rounded-xl border focus:outline-none focus:ring-2 bg-white text-gray-950 border-gray-200 focus:ring-indigo-500 dark:bg-zinc-900 dark:text-zinc-100 dark:border-zinc-700 transition-all" />
        
        <!-- 🎯 ปุ่มเปิด/ปิดตา (สลับไอคอนดวงตา / ตาขีดฆ่า) -->
        <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
          class="absolute right-3 p-1 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-zinc-300 cursor-pointer focus:outline-none transition-colors">
          <svg *ngIf="!showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" [disabled]="isLoading || !newPassword || !confirmPassword"
      class="w-full py-3.5 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      <span *ngIf="isLoading" class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      {{ isLoading ? 'Saving...' : 'Reset Password' }}
    </button>
  </form>

  <div *ngIf="isSuccess" class="bg-emerald-50 dark:bg-emerald-500/10 p-6 rounded-xl border border-emerald-100 dark:border-emerald-500/20 text-center space-y-3">
    <div class="text-4xl animate-bounce">🎉</div>
    <p class="text-lg text-emerald-800 dark:text-emerald-400 font-bold">Password Reset Successfully!</p>
    <p class="text-sm text-gray-500 dark:text-zinc-400">Redirecting to the login page in 3 seconds...</p>
  </div>

</div>
