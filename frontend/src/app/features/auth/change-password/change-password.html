<div class="max-w-lg w-full bg-white dark:bg-zinc-900 rounded-2xl border border-gray-100 dark:border-zinc-800/80 p-8 md:p-10 shadow-xl space-y-6 transition-all">
  
  <div class="text-center space-y-2">
    <!-- เปลี่ยนหัวข้อให้เป็น Change Password -->
    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-zinc-50 tracking-tight">Change Password</h2>
    <p class="text-sm text-gray-500 dark:text-zinc-400">Confirm your email address below, and we'll send a link to securely change your password.</p>
  </div>

  <form *ngIf="!isSentSuccess" (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
      <label class="block text-sm font-semibold mb-2 text-gray-600 dark:text-zinc-400">Your Email Address</label>
      <!-- ใช้ disabled หรือ readonly ไว้เลยเพราะเขาล็อกอินอยู่แล้ว ป้องกันการพิมพ์มั่วครับ -->
      <input type="email" name="email" [(ngModel)]="email" [disabled]="true"
        class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-gray-400 border-gray-200 dark:bg-zinc-900/40 dark:text-zinc-500 dark:border-zinc-700 cursor-not-allowed transition-all" />
    </div>

    <button type="submit" [disabled]="isLoading || !email"
      class="w-full py-3.5 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      <span *ngIf="isLoading" class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      <!-- ปรับข้อความบนปุ่มกด -->
      {{ isLoading ? 'Sending request...' : 'Send Change Link' }}
    </button>
  </form>

  <!-- กล่องแสดงสถานะเมื่อส่งเมลสำเร็จ (ข้อความ {{ message }} จะกลายเป็นภาษาอังกฤษที่เราแก้ไว้ในหลังบ้าน) -->
  <div *ngIf="isSentSuccess" class="bg-emerald-50 dark:bg-emerald-500/10 p-5 rounded-xl border border-emerald-100 dark:border-emerald-500/20 text-center space-y-3">
    <div class="text-3xl animate-bounce">✉️</div>
    <p class="text-sm text-emerald-800 dark:text-emerald-400 font-semibold">{{ message }}</p>
    <p class="text-xs text-gray-400 dark:text-zinc-500">Please check your inbox within 15 minutes.</p>
  </div>

  <div class="text-center pt-2 border-t border-gray-100 dark:border-zinc-800/50">
    <!-- เปลี่ยนเป็น button และผูก (click)="goBack()" แทน -->
    <button type="button" (click)="goBack()" 
      class="inline-flex items-center gap-1.5 text-sm font-semibold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 transition-colors cursor-pointer focus:outline-none">
      ← Back to Profile
    </button>
  </div>

</div>
