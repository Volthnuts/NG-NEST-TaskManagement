<div class="max-w-md w-full bg-white dark:bg-zinc-900 rounded-2xl border border-gray-100 dark:border-zinc-800/80 p-8 shadow-xl text-center space-y-6 animate-fade-in">
  
  <div *ngIf="isLoading" class="space-y-4 py-6">
    <div class="h-12 w-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
    <h2 class="text-xl font-bold text-gray-900 dark:text-zinc-100">Verifying your email...</h2>
    <p class="text-sm text-gray-500 dark:text-zinc-400">Plesse wait.</p>
  </div>

  <div *ngIf="!isLoading && isSuccess" class="space-y-4">
    <div class="h-16 w-16 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl shadow-sm">
      ✓
    </div>
    <h2 class="text-2xl font-bold text-gray-900 dark:text-zinc-50">Very Success!</h2>
    <p class="text-sm text-gray-400 dark:text-zinc-400 leading-relaxed">
      Your account has been Active. Now you can use TaskFlow.
    </p>
    <div class="pt-4">
      <a routerLink="/login" class="block w-full text-center px-6 py-3 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-md">
        Go to Login 🚀
      </a>
    </div>
  </div>

  <div *ngIf="!isLoading && !isSuccess" class="space-y-4">
    <div class="h-16 w-16 bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 rounded-full flex items-center justify-center mx-auto text-2xl shadow-sm">
      ✕
    </div>
    <h2 class="text-2xl font-bold text-gray-900 dark:text-zinc-50">Error</h2>
    <p class="text-sm text-rose-600 dark:text-rose-400 font-medium bg-rose-50/50 dark:bg-rose-500/5 p-3 rounded-xl">
      {{ errorMessage }}
    </p>
    <p class="text-xs text-gray-400 dark:text-zinc-500">
      Please try again later.
    </p>
    <div class="pt-4 flex gap-3">
      <a routerLink="/register" class="flex-1 text-center px-4 py-2.5 rounded-xl text-sm font-semibold text-gray-600 dark:text-zinc-300 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200/70 transition-all">สมัครใหม่</a>
      <a routerLink="/login" class="flex-1 text-center px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-md">ไปหน้า Login</a>
    </div>
  </div>

</div>
