<div class="w-full max-w-xl p-10 rounded-2xl shadow-xl transition-colors duration-300 bg-white dark:bg-zinc-800">
  
  <h2 class="text-3xl font-extrabold text-center mb-8 text-gray-900 dark:text-zinc-50">
    Sign in to your account
  </h2>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">
    
    <div>
      <label class="block text-sm font-medium mb-1.5 text-gray-600 dark:text-zinc-400">
        Email address
      </label>
      <input type="email" 
             formControlName="email" 
             class="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring-2 transition-all bg-white text-gray-950 border-gray-300 focus:ring-blue-500 dark:bg-zinc-900 dark:text-zinc-100 dark:border-zinc-700 dark:focus:ring-blue-500" 
             placeholder="you@example.com" />
      <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']" class="text-xs text-rose-500 mt-1">
        * Please enter a valid email address.
      </p>
      <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="text-xs text-rose-500 mt-1">
        * Email is required.
      </p>
    </div>

    <!-- ช่อง Password พร้อมปุ่มตา -->
    <div>
      <label class="block text-sm font-medium mb-1.5 text-gray-600 dark:text-zinc-400">
        Password
      </label>
      <!-- 🎯 ครอบด้วย relative และเพิ่ม Template Variable ชื่อ #loginPwdContainer ตรงนี้ครับ -->
      <div class="relative flex items-center" #loginPwdContainer>
        <input [type]="loginPwdContainer.getAttribute('data-show') === 'true' ? 'text' : 'password'" 
               formControlName="password" 
               class="w-full pl-4 pr-12 py-3 rounded-lg border focus:outline-none focus:ring-2 transition-all bg-white text-gray-950 border-gray-300 focus:ring-blue-500 dark:bg-zinc-900 dark:text-zinc-100 dark:border-zinc-700 dark:focus:ring-blue-500" 
               placeholder="••••••••" />
        
        <button type="button" 
                (click)="loginPwdContainer.setAttribute('data-show', loginPwdContainer.getAttribute('data-show') === 'true' ? 'false' : 'true')"
                class="absolute right-3 p-1 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-zinc-300 cursor-pointer focus:outline-none transition-colors">
          <!-- ไอคอนลูกตา (ตอนซ่อนรหัสผ่าน) -->
          <svg *ngIf="loginPwdContainer.getAttribute('data-show') !== 'true'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <!-- ไอคอนลูกตามีเส้นคาด (ตอนแสดงรหัสผ่าน) -->
          <svg *ngIf="loginPwdContainer.getAttribute('data-show') === 'true'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>
      <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" class="text-xs text-rose-500 mt-1">
        * Password is required.
      </p>
    </div>

    <div class="flex items-center justify-end text-sm">
      <a routerLink="/forgotPassword"  class="font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300 transition-colors">
        Forgot password?
      </a>
    </div>

    <button type="submit" 
            [disabled]="loginForm.invalid || isLoading"
            class="w-full py-3 px-4 rounded-lg font-semibold text-white cursor-pointer transition-all duration-150 active:scale-98 shadow-md bg-indigo-600 hover:bg-indigo-700 hover:shadow-indigo-200 dark:bg-indigo-500 dark:hover:bg-indigo-600 dark:hover:shadow-none disabled:opacity-50 disabled:cursor-not-allowed">
      <span *ngIf="isLoading" class="inline-block h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></span>
      {{ isLoading ? 'Signing In...' : 'Sign In' }}
    </button>

    <div class="text-center pt-2">
      <p class="text-sm text-gray-500 dark:text-zinc-400">
        Don't have an account? 
        <a routerLink="/register" 
           class="font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300 transition-colors ml-1">
          Register here
        </a>
      </p>
    </div>

  </form>
</div>
