<!-- ปรับความกว้างจาก max-w-md เป็น max-w-lg เพื่อให้แผ่ขยายบนจอคอมพิวเตอร์ได้สวยขึ้น ไม่ดูเป็นแท่งยาว -->
<div class="max-w-lg w-full bg-white dark:bg-zinc-900 rounded-2xl border border-gray-100 dark:border-zinc-800/80 p-8 md:p-10 shadow-xl space-y-6 transition-all">
  
  <div class="text-center space-y-2">
    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-zinc-50 tracking-tight">Forgot Password?</h2>
    <p class="text-sm text-gray-500 dark:text-zinc-400">Enter your email address below and we'll send you a link to reset your password.</p>
  </div>

  <form *ngIf="!isSentSuccess" (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
      <label class="block text-sm font-semibold mb-2 text-gray-600 dark:text-zinc-400">Email Address</label>
      <input type="email" name="email" [(ngModel)]="email" required placeholder="name@company.com"
        class="w-full px-4 py-3 rounded-xl border focus:outline-none focus:ring-2 bg-white text-gray-950 border-gray-200 focus:ring-indigo-500 dark:bg-zinc-900 dark:text-zinc-100 dark:border-zinc-700 transition-all" />
    </div>

    <button type="submit" [disabled]="isLoading || !email"
      class="w-full py-3.5 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      <span *ngIf="isLoading" class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      {{ isLoading ? 'Sending request...' : 'Send Reset Link' }}
    </button>
  </form>

  <div *ngIf="isSentSuccess" class="bg-emerald-50 dark:bg-emerald-500/10 p-5 rounded-xl border border-emerald-100 dark:border-emerald-500/20 text-center space-y-3">
    <div class="text-3xl animate-bounce">✉️</div>
    <p class="text-sm text-emerald-800 dark:text-emerald-400 font-semibold">{{ message }}</p>
    <p class="text-xs text-gray-400 dark:text-zinc-500">Please check your inbox within 15 minutes.</p>
  </div>

  <div class="text-center pt-2 border-t border-gray-100 dark:border-zinc-800/50">
    <a routerLink="/login" class="inline-flex items-center gap-1.5 text-sm font-semibold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 transition-colors">
      ← Back to Login
    </a>
  </div>

</div>
